<header class="app-header">
  <a class="brand" routerLink="/">{{ 'app.title' | transloco }}</a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'nav.dashboard' | transloco }}
    </a>
    <a routerLink="/rides" routerLinkActive="active">{{ 'nav.rides' | transloco }}</a>
    <a routerLink="/statistics" routerLinkActive="active">{{ 'nav.statistics' | transloco }}</a>
    @if (isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">{{ 'nav.admin' | transloco }}</a>
    }
  </nav>

  <div class="session">
    <div class="lang-switch" role="group" [attr.aria-label]="'nav.language' | transloco">
      @for (lang of languages; track lang) {
        <button
          type="button"
          [attr.data-lang]="lang"
          [class.active]="lang === activeLanguage()"
          (click)="useLanguage(lang)"
        >
          {{ lang | uppercase }}
        </button>
      }
    </div>
    @if (isLoggedIn()) {
      <button mat-button type="button" data-logout (click)="logout()">{{ 'nav.logout' | transloco }}</button>
    } @else {
      <a mat-button routerLink="/login">{{ 'nav.login' | transloco }}</a>
    }
  </div>
</header>
