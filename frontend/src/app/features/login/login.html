<section class="login">
  <h1>{{ 'login.title' | transloco }}</h1>

  @if (waiting()) {
    <p class="waiting" role="status" data-waiting>{{ 'login.waiting' | transloco }}</p>
  }

  @if (failed()) {
    <p class="error" role="alert">{{ 'login.externalError' | transloco }}</p>
  }

  <!-- Links, not buttons: signing in is a navigation to the API, which holds the client id. -->
  <nav class="providers">
    @for (provider of providers; track provider.id) {
      <a mat-stroked-button [href]="authorizeUrl(provider.id)">
        {{ 'login.continueWith' | transloco: { provider: provider.name } }}
      </a>
    }
  </nav>
</section>
