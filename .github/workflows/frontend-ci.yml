name: Frontend CI

on:
  push:
    # develop too: work lands there directly, so this is where a break is caught early.
    # Only main deploys — the deploy job is gated on the ref below.
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The basemap key is public by nature (it ships in the bundle) but is kept out of the repo, so
      # it is written in here from the secret. Absent — on a PR, say — the build still succeeds and
      # simply draws no basemap (#193).
      - name: Inject the basemap key
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
        run: node scripts/inject-map-key.mjs

      - run: npm run build
      - run: npm test -- --watch=false

  deploy:
    # Only deploy pushes that land on main; PRs just build and test above.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # As above: the deployed bundle is the one that actually needs the key.
      - name: Inject the basemap key
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
        run: node scripts/inject-map-key.mjs
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # Deploy the pre-built production bundle; staticwebapp.config.json (copied from public/)
      # provides SPA fallback so deep links like /rides/42 resolve to index.html.
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "frontend/dist/frontend/browser"
          skip_app_build: true
          skip_api_build: true
